[project]
name = "codebase-rag-debugger-backend"
version = "0.1.0"
description = "FastAPI backend for the Codebase RAG Debugger"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "groq==0.11.0",
    "chromadb>=0.5.20",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "pydantic==2.9.2",
    "google-genai>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
